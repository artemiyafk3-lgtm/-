<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HOTLINE: NEON PATHFINDER - ACCOUNT EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Monoton&family=Roboto+Mono:wght@400;700&display=swap');
        
        * {
            user-select: none;
            box-sizing: border-box;
        }

        body, html { 
            margin: 0; padding: 0; background: #000; overflow: hidden; 
            width: 100vw; height: 100vh; cursor: crosshair; 
        }

        canvas { 
            display: block; 
            filter: contrast(1.6) saturate(1.9) brightness(1.1);
        }

        /* Базовый UI во время игры */
        #ui { 
            position: absolute; top: 20px; left: 20px; color: #fff; 
            font-family: 'Roboto Mono', monospace; pointer-events: none; z-index: 10; 
            text-shadow: 2px 2px #f0f, 0 0 10px #fff; 
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        
        #stats-panel {
            position: absolute; top: 20px; right: 20px;
            font-family: 'Roboto Mono', monospace; pointer-events: none; z-index: 10;
            text-align: right;
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }
        
        #stats-panel span {
            color: #ff0;
            font-weight: bold;
        }

        /* Меню с регистрацией, лидербордом */
        .menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; justify-content: center; align-items: center;
            background: rgba(8, 0, 18, 0.97); 
            backdrop-filter: blur(8px);
            z-index: 200; 
            font-family: 'Roboto Mono', monospace;
            transition: all 0.2s;
        }

        .menu-container {
            width: 500px;
            max-width: 90%;
            background: #0a0a1a;
            border: 3px solid #f0f;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.4);
            padding: 20px;
            border-radius: 24px;
            text-align: center;
        }

        .menu-title {
            font-family: 'Monoton', cursive;
            font-size: 48px;
            color: #ff0;
            text-shadow: 4px 4px 0 #f0f;
            margin: 0 0 10px 0;
        }

        .input-group {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .input-group label {
            color: #0ff;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .input-group input {
            background: #111;
            border: 2px solid #f0f;
            padding: 10px;
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            border-radius: 8px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #0ff;
            box-shadow: 0 0 10px #0ff;
        }

        .btn-neon {
            background: none;
            border: 2px solid #ff0;
            color: #ff0;
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 40px;
        }

        .btn-neon:hover {
            background: #ff0;
            color: #000;
            box-shadow: 0 0 20px #ff0;
        }

        .btn-danger {
            border-color: #f66;
            color: #f66;
        }
        .btn-danger:hover {
            background: #f66;
            color: #000;
            box-shadow: 0 0 20px #f66;
        }

        .leaderboard {
            background: #000000aa;
            border: 1px solid #f0f;
            border-radius: 16px;
            padding: 10px;
            margin: 20px 0;
            max-height: 250px;
            overflow-y: auto;
        }

        .leaderboard h3 {
            color: #ff0;
            margin: 0 0 8px 0;
            font-size: 18px;
        }

        .lb-entry {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 5px;
            border-bottom: 1px solid #f0f3;
            color: #cfc;
        }

        .lb-rank {
            color: #ff0;
            width: 35px;
        }

        .lb-name {
            flex: 2;
            text-align: left;
            text-transform: uppercase;
        }
        .lb-stats {
            flex: 2;
            text-align: right;
        }

        .status-msg {
            color: #ff66aa;
            font-size: 12px;
            margin-top: 8px;
            min-height: 30px;
        }

        .flex-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2a;
        }
        ::-webkit-scrollbar-thumb {
            background: #f0f;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div id="ui" style="display: none;">
    <div style="font-size: 28px; color: #0ff;">STATUS: NEON PURSUIT</div>
    <div id="stat">KILLS: 0 | TARGETS: 0</div>
    <div style="font-size: 14px; color: #f0f;">ENEMIES OBEY TOPOLOGY | [R] REGENERATE</div>
</div>

<div id="stats-panel" style="display: none;">
    <div>⚡ <span id="total-kills-display">0</span> TOTAL KILLS</div>
    <div>🏆 <span id="wins-display">0</span> WINS | 💀 <span id="losses-display">0</span> LOSSES</div>
    <div>🎯 ROUND: <span id="round-winloss">-</span></div>
</div>

<!-- Главное меню с аккаунтами и лидербордом -->
<div id="menuRoot" class="menu-overlay">
    <div class="menu-container">
        <div class="menu-title">HOTLINE: PATHFINDER</div>
        <div style="color:#fff; margin-bottom: 15px;">⚡ ACCOUNT SYSTEM ⚡</div>
        
        <div class="input-group">
            <label>🔐 LOGIN / NICKNAME</label>
            <input type="text" id="loginName" placeholder="CODER" maxlength="16" autocomplete="off">
        </div>
        <div class="input-group">
            <label>🔑 PASSWORD</label>
            <input type="password" id="loginPass" placeholder="••••••" maxlength="20">
        </div>
        
        <div class="flex-row">
            <button class="btn-neon" id="btnRegister">📀 REGISTER</button>
            <button class="btn-neon" id="btnLogin">🎮 LOGIN & PLAY</button>
        </div>
        
        <div class="leaderboard">
            <h3>🏅 LEADERBOARD (KILLS / WINS)</h3>
            <div id="leaderboardList">-- LOADING --</div>
        </div>
        <div id="menuStatus" class="status-msg">⚡ Введи имя и пароль, чтобы начать</div>
    </div>
</div>

<canvas id="g"></canvas>

<script>
    // ---------- СИСТЕМА АККАУНТОВ (localStorage) ----------
    let accounts = {}; // { "login": { pass: "xxx", kills: 0, wins: 0, losses: 0 } }
    let currentUser = null; // { login, kills, wins, losses }
    
    function loadAccounts() {
        const stored = localStorage.getItem("hotline_accounts_v2");
        if(stored) {
            accounts = JSON.parse(stored);
        } else {
            // демо-аккаунт для теста
            accounts = {
                "NEON": { pass: "123", kills: 47, wins: 5, losses: 2 },
                "RAVE": { pass: "hot", kills: 128, wins: 12, losses: 3 },
                "GHOST": { pass: "miami", kills: 89, wins: 7, losses: 4 }
            };
            saveAccounts();
        }
    }
    
    function saveAccounts() {
        localStorage.setItem("hotline_accounts_v2", JSON.stringify(accounts));
    }
    
    function updateLeaderboardUI() {
        const container = document.getElementById("leaderboardList");
        if(!container) return;
        let entries = [];
        for(let login in accounts) {
            let acc = accounts[login];
            entries.push({ login, kills: acc.kills || 0, wins: acc.wins || 0, losses: acc.losses || 0 });
        }
        entries.sort((a,b) => {
            if(a.kills !== b.kills) return b.kills - a.kills;
            return b.wins - a.wins;
        });
        if(entries.length === 0) {
            container.innerHTML = "<div style='color:#888'>NO DATA</div>";
            return;
        }
        let html = "";
        entries.slice(0, 10).forEach((e, idx) => {
            html += `<div class="lb-entry">
                        <span class="lb-rank">#${idx+1}</span>
                        <span class="lb-name">${e.login.toUpperCase()}</span>
                        <span class="lb-stats">💀${e.kills} | 🏆${e.wins} | 💔${e.losses}</span>
                     </div>`;
        });
        container.innerHTML = html;
    }
    
    function registerUser(login, password) {
        if(!login || login.trim() === "") return "Имя не может быть пустым!";
        if(password.length < 2) return "Пароль минимум 2 символа";
        if(accounts[login]) return "Такой логин уже существует!";
        accounts[login] = { pass: password, kills: 0, wins: 0, losses: 0 };
        saveAccounts();
        updateLeaderboardUI();
        return "OK";
    }
    
    function loginUser(login, password) {
        if(!accounts[login]) return "Аккаунт не найден";
        if(accounts[login].pass !== password) return "Неверный пароль";
        currentUser = {
            login: login,
            kills: accounts[login].kills || 0,
            wins: accounts[login].wins || 0,
            losses: accounts[login].losses || 0
        };
        return "OK";
    }
    
    function updateUserStats(killsGained, winFlag, lossFlag) {
        if(!currentUser) return;
        let acc = accounts[currentUser.login];
        if(acc) {
            if(killsGained > 0) acc.kills = (acc.kills || 0) + killsGained;
            if(winFlag) acc.wins = (acc.wins || 0) + 1;
            if(lossFlag) acc.losses = (acc.losses || 0) + 1;
            saveAccounts();
            // обновляем currentUser
            currentUser.kills = acc.kills;
            currentUser.wins = acc.wins;
            currentUser.losses = acc.losses;
            updateLeaderboardUI();
            updateStatsPanel();
        }
    }
    
    function updateStatsPanel() {
        if(!currentUser) return;
        const killsSpan = document.getElementById("total-kills-display");
        const winsSpan = document.getElementById("wins-display");
        const lossesSpan = document.getElementById("losses-display");
        if(killsSpan) killsSpan.innerText = currentUser.kills;
        if(winsSpan) winsSpan.innerText = currentUser.wins;
        if(lossesSpan) lossesSpan.innerText = currentUser.losses;
    }
    
    // ---------- ИГРОВАЯ ЛОГИКА (оригинальная с доп. статистикой) ----------
    const cvs = document.getElementById('g');
    const ctx = cvs.getContext('2d');
    const overlayMenu = document.getElementById('menuRoot');
    const uiGame = document.getElementById('ui');
    const statsPanel = document.getElementById('stats-panel');
    let player, enemies = [], bullets = [], walls = [], blood = [], nodes = [];
    let shake = 0, score = 0, state = 'MENU', frame = 0;
    const keys = {};
    let audioCtx, mainGain;
    let currentRoundResult = null; // 'win' or 'loss' для отображения в панели
    
    // статистика раунда
    let roundKills = 0;
    let roundWinFlag = false;
    let roundLossFlag = false;
    
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bass = audioCtx.createOscillator();
        const lfo = audioCtx.createOscillator();
        const lfoG = audioCtx.createGain();
        bass.type = 'sawtooth'; bass.frequency.value = 50; 
        lfo.type = 'sine'; lfo.frequency.value = 3.5; lfoG.gain.value = 8;
        mainGain = audioCtx.createGain(); mainGain.gain.value = 0.18;
        lfo.connect(lfoG); lfoG.connect(bass.frequency);
        bass.connect(mainGain); mainGain.connect(audioCtx.destination);
        bass.start(); lfo.start();
    }
    
    function sfx(f, d, t='square') {
        if(!audioCtx) return;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+d);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+d);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d);
    }
    
    cvs.width = window.innerWidth; cvs.height = window.innerHeight;
    
    function isWall(x, y, r) {
        return walls.some(w => x+r > w.x && x-r < w.x+w.w && y+r > w.y && y-r < w.y+w.h);
    }
    
    function build() {
        walls = []; nodes = [];
        const W = cvs.width, H = cvs.height, B = 25;
        walls.push({x:0, y:0, w:W, h:B}, {x:0, y:H-B, w:W, h:B}, {x:0, y:0, w:B, h:H}, {x:W-B, y:0, w:B, h:H});
        const cw = (W-B*2)/3, ch = (H-B*2)/2, d = 170;
        for(let i=1; i<3; i++) {
            let x = B+i*cw, gy = B+100+Math.random()*(H-B*2-300);
            walls.push({x, y:B, w:B, h:gy-B}, {x, y:gy+d, w:B, h:H-(gy+d)-B});
        }
        for(let i=0; i<3; i++) {
            let sx = B+i*cw, gx = sx+50+Math.random()*(cw-d-100), my = B+ch;
            walls.push({x:sx, y:my, w:gx-sx, h:B}, {x:gx+d, y:my, w:(sx+cw)-(gx+d), h:B});
        }
        for(let x=45; x<W; x+=70) {
            for(let y=45; y<H; y+=70) {
                if(!isWall(x, y, 35)) nodes.push({x, y});
            }
        }
        for(let i=0; i<60; i++) {
            let nx = 50 + Math.random() * (W-100);
            let ny = 50 + Math.random() * (H-100);
            if(!isWall(nx, ny, 30) && !nodes.some(n => Math.hypot(n.x-nx, n.y-ny) < 45)) {
                nodes.push({x: nx, y: ny});
            }
        }
    }
    
    function canSee(x1, y1, x2, y2, r=8) {
        let dist = Math.hypot(x2-x1, y2-y1);
        let steps = Math.ceil(dist / 12);
        for(let i=0; i<=steps; i++) {
            let t = i / steps;
            let cx = x1 + (x2-x1)*t;
            let cy = y1 + (y2-y1)*t;
            if(isWall(cx, cy, r)) return false;
        }
        return true;
    }
    
    function findPathToPlayer(enemy) {
        if(nodes.length === 0) return null;
        let startNode = null, startDist = Infinity;
        for(let n of nodes) {
            if(canSee(enemy.x, enemy.y, n.x, n.y, 10)) {
                let d = Math.hypot(n.x - enemy.x, n.y - enemy.y);
                if(d < startDist) { startDist = d; startNode = n; }
            }
        }
        if(!startNode) return null;
        let targetNode = null, targetDist = Infinity;
        for(let n of nodes) {
            if(canSee(player.x, player.y, n.x, n.y, 10)) {
                let d = Math.hypot(n.x - player.x, n.y - player.y);
                if(d < targetDist) { targetDist = d; targetNode = n; }
            }
        }
        if(!targetNode) return null;
        if(canSee(enemy.x, enemy.y, player.x, player.y, 12)) return { x: player.x, y: player.y, direct: true };
        let queue = [{node: startNode, path: [startNode]}];
        let visited = new Set(); visited.add(startNode);
        while(queue.length > 0) {
            let {node, path} = queue.shift();
            if(node === targetNode || Math.hypot(node.x - targetNode.x, node.y - targetNode.y) < 60) {
                if(path.length > 1) return path[1];
                return targetNode;
            }
            for(let neighbor of nodes) {
                if(visited.has(neighbor)) continue;
                if(canSee(node.x, node.y, neighbor.x, neighbor.y, 12)) {
                    visited.add(neighbor);
                    queue.push({node: neighbor, path: [...path, neighbor]});
                }
            }
        }
        let best = null, bestScore = -Infinity;
        for(let n of nodes) {
            if(canSee(enemy.x, enemy.y, n.x, n.y, 12)) {
                let toPlayer = Math.hypot(player.x - n.x, player.y - n.y);
                let score = -toPlayer;
                if(score > bestScore) { bestScore = score; best = n; }
            }
        }
        return best;
    }
    
    function startGame() {
        if(state !== 'PLAY') return;
        build();
        let px, py; 
        do { 
            px = 100+Math.random()*(cvs.width-200); 
            py = 100+Math.random()*(cvs.height-200); 
        } while(isWall(px, py, 30));
        player = { x: px, y: py, a: 0, s: 7, r: 22, lastShot: 0 };
        enemies = []; bullets = []; blood = []; 
        roundKills = 0;
        roundWinFlag = false;
        roundLossFlag = false;
        for(let i=0; i<14; i++) {
            let rx, ry; 
            do { 
                rx = Math.random()*cvs.width; 
                ry = Math.random()*cvs.height; 
            } while(isWall(rx, ry, 40) || Math.hypot(rx-px, ry-py)<400);
            enemies.push({ 
                x: rx, y: ry, a: Math.random()*Math.PI*2, s: 4.5, r: 20, 
                alert: false, pathTarget: null, stuckTimer: 0, lastX: rx, lastY: ry, patrolTarget: null
            });
        }
        updateUIStats();
        if(currentUser) updateStatsPanel();
    }
    
    function updateUIStats() {
        document.getElementById('stat').innerHTML = `KILLS: ${score} | TARGETS: ${enemies.length}`;
        if(currentUser) {
            const roundSpan = document.getElementById("round-winloss");
            if(roundSpan) roundSpan.innerText = `${roundKills} KILLS / ${enemies.length} LEFT`;
        }
    }
    
    function endRound(isWin) {
        if(state !== 'PLAY') return;
        state = 'MENU';
        if(isWin && enemies.length === 0) {
            roundWinFlag = true;
            if(currentUser) updateUserStats(roundKills, true, false);
            currentRoundResult = 'WIN';
        } else if(!isWin) {
            roundLossFlag = true;
            if(currentUser) updateUserStats(roundKills, false, true);
            currentRoundResult = 'LOSS';
        } else {
            if(currentUser && roundKills > 0) updateUserStats(roundKills, false, false);
        }
        overlayMenu.style.display = 'flex';
        uiGame.style.display = 'none';
        statsPanel.style.display = 'none';
        if(mainGain) mainGain.gain.setTargetAtTime(0, audioCtx?.currentTime || 0, 0.1);
        showMenuAfterGame();
    }
    
    function showMenuAfterGame() {
        const statusDiv = document.getElementById("menuStatus");
        if(currentUser && currentRoundResult) {
            statusDiv.innerHTML = `🏁 РАУНД ЗАВЕРШЁН: ${currentRoundResult === 'WIN' ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ...'} | УБИЙСТВ: ${roundKills}<br>⚡ ${currentUser.login}, общая статистика обновлена!`;
        } else if(currentUser) {
            statusDiv.innerHTML = `🔁 ИГРА ОСТАНОВЛЕНА. ВОЙДИ ЗАНОВО, ЕСЛИ НУЖНО.`;
        } else {
            statusDiv.innerHTML = `⚡ Введи имя и пароль, чтобы начать`;
        }
        updateLeaderboardUI();
        if(currentUser) updateStatsPanel();
        currentRoundResult = null;
    }
    
    // обновление логики игры с проверкой победы
    function updateGame() {
        if(state !== 'PLAY') return;
        frame++;
        if(keys['KeyW']) player.y -= player.s; 
        if(keys['KeyS']) player.y += player.s;
        if(keys['KeyA']) player.x -= player.s; 
        if(keys['KeyD']) player.x += player.s;
        [player, ...enemies].forEach(obj => {
            walls.forEach(w => {
                let cx = Math.max(w.x, Math.min(obj.x, w.x+w.w)), cy = Math.max(w.y, Math.min(obj.y, w.y+w.h));
                let d = Math.hypot(obj.x-cx, obj.y-cy);
                if(d < obj.r) {
                    let o = obj.r - d; 
                    obj.x += ((obj.x-cx)/d)*o; 
                    obj.y += ((obj.y-cy)/d)*o;
                }
            });
        });
        for(let i=0; i<enemies.length; i++) {
            let en = enemies[i];
            let moved = Math.hypot(en.x - en.lastX, en.y - en.lastY);
            if(moved < 1.5) en.stuckTimer = (en.stuckTimer || 0) + 1;
            else en.stuckTimer = 0;
            en.lastX = en.x; en.lastY = en.y;
            let distToPlayer = Math.hypot(en.x-player.x, en.y-player.y);
            let seePlayer = canSee(en.x, en.y, player.x, player.y, 12);
            if(seePlayer && distToPlayer < 700) en.alert = true;
            if(distToPlayer < 350) en.alert = true;
            for(let j=0; j<enemies.length; j++) {
                if(i === j) continue;
                let other = enemies[j];
                let d = Math.hypot(en.x-other.x, en.y-other.y);
                if(d < 48) {
                    let angle = Math.atan2(en.y-other.y, en.x-other.x);
                    let push = (48 - d) * 0.12;
                    en.x += Math.cos(angle) * push;
                    en.y += Math.sin(angle) * push;
                }
            }
            if(en.alert) {
                if(en.stuckTimer > 15) {
                    en.a += (Math.random() - 0.5) * 1.8;
                    en.x += Math.cos(en.a) * en.s;
                    en.y += Math.sin(en.a) * en.s;
                    en.stuckTimer = 0;
                } else {
                    let nextTarget = null;
                    if(seePlayer) {
                        nextTarget = { x: player.x, y: player.y, direct: true };
                        en.pathTarget = null;
                    } else {
                        if(!en.pathTarget || Math.hypot(en.x - en.pathTarget.x, en.y - en.pathTarget.y) < 35 || 
                           (en.pathTarget.direct && !canSee(en.x, en.y, en.pathTarget.x, en.pathTarget.y, 12))) {
                            let pathNode = findPathToPlayer(en);
                            if(pathNode) en.pathTarget = pathNode;
                        }
                        if(en.pathTarget) nextTarget = en.pathTarget;
                    }
                    if(nextTarget) {
                        let targetAngle = Math.atan2(nextTarget.y - en.y, nextTarget.x - en.x);
                        en.a = targetAngle;
                        en.x += Math.cos(en.a) * en.s;
                        en.y += Math.sin(en.a) * en.s;
                    } else {
                        let angleToPlayer = Math.atan2(player.y - en.y, player.x - en.x);
                        let testX = en.x + Math.cos(angleToPlayer) * 25;
                        let testY = en.y + Math.sin(angleToPlayer) * 25;
                        if(!isWall(testX, testY, en.r-2)) en.a = angleToPlayer;
                        else {
                            for(let off = -1.2; off <= 1.2; off += 0.6) {
                                let tryAngle = angleToPlayer + off;
                                let tx = en.x + Math.cos(tryAngle) * 25;
                                let ty = en.y + Math.sin(tryAngle) * 25;
                                if(!isWall(tx, ty, en.r-2)) { en.a = tryAngle; break; }
                            }
                        }
                        en.x += Math.cos(en.a) * en.s;
                        en.y += Math.sin(en.a) * en.s;
                    }
                }
            } else {
                if(!en.patrolTarget || Math.hypot(en.x - en.patrolTarget.x, en.y - en.patrolTarget.y) < 40) {
                    let possible = nodes.filter(n => canSee(en.x, en.y, n.x, n.y, 12));
                    if(possible.length) en.patrolTarget = possible[Math.floor(Math.random() * possible.length)];
                    else if(nodes.length) en.patrolTarget = nodes[Math.floor(Math.random() * nodes.length)];
                }
                if(en.patrolTarget) {
                    let angle = Math.atan2(en.patrolTarget.y - en.y, en.patrolTarget.x - en.x);
                    en.a = angle;
                    en.x += Math.cos(angle) * (en.s * 0.7);
                    en.y += Math.sin(angle) * (en.s * 0.7);
                } else {
                    en.a += (Math.random() - 0.5) * 0.8;
                    en.x += Math.cos(en.a) * 2.5;
                    en.y += Math.sin(en.a) * 2.5;
                }
            }
            walls.forEach(w => {
                let cx = Math.max(w.x, Math.min(en.x, w.x+w.w));
                let cy = Math.max(w.y, Math.min(en.y, w.y+w.h));
                let d = Math.hypot(en.x-cx, en.y-cy);
                if(d < en.r) {
                    let o = en.r - d;
                    if(d > 0.01) { en.x += ((en.x-cx)/d)*o; en.y += ((en.y-cy)/d)*o; }
                    else { en.x += (Math.random() - 0.5) * o; en.y += (Math.random() - 0.5) * o; }
                }
            });
            for(let bi=0; bi<bullets.length; bi++) {
                let b = bullets[bi];
                if(Math.hypot(b.x-en.x, b.y-en.y) < 35) {
                    enemies.splice(i,1); bullets.splice(bi,1); 
                    score++; roundKills++; shake = 25;
                    sfx(60, 0.2, 'triangle');
                    for(let k=0;k<25;k++) blood.push({x:en.x, y:en.y, vx:(Math.random()-0.5)*20, vy:(Math.random()-0.5)*20, r:Math.random()*12+4});
                    i--; break;
                }
            }
            if(enemies[i] && Math.hypot(player.x-enemies[i].x, player.y-enemies[i].y) < 38) { 
                endRound(false); return;
            }
        }
        for(let bi=0; bi<bullets.length; bi++){ 
            let b = bullets[bi];
            b.x += b.vx; b.y += b.vy; 
            if(isWall(b.x, b.y, 5)) bullets.splice(bi,1); 
        }
        updateUIStats();
        if(enemies.length === 0 && state === 'PLAY') { endRound(true); return; }
    }
    
    // отрисовка и цикл
    function draw() {
        ctx.setTransform(1, 0, 0, 1, 0, 0); 
        let hue = 260 + Math.sin(frame*0.02)*10;
        ctx.fillStyle = `hsl(${hue}, 100%, 5%)`; 
        ctx.fillRect(0, 0, cvs.width, cvs.height);
        if(shake > 0.5) { let sx = Math.random()*shake-shake/2, sy = Math.random()*shake-shake/2; ctx.translate(sx, sy); shake *= 0.88; }
        blood.forEach((b, i) => {
            ctx.fillStyle = 'rgba(255, 0, 100, 0.6)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
            b.x += b.vx; b.y += b.vy; b.vx *= 0.9; b.vy *= 0.9; b.r *= 0.99; if(b.r < 1) blood.splice(i,1);
        });
        walls.forEach(w => { ctx.fillStyle = '#100020'; ctx.fillRect(w.x, w.y, w.w, w.h); ctx.save(); ctx.strokeStyle = '#f0f'; ctx.lineWidth = 4; ctx.shadowBlur = 15; ctx.shadowColor = '#f0f'; ctx.strokeRect(w.x, w.y, w.w, w.h); ctx.restore(); });
        if(state === 'PLAY') {
            enemies.forEach(en => { ctx.save(); ctx.translate(en.x, en.y); ctx.rotate(en.a); ctx.fillStyle = '#ff0'; ctx.shadowBlur = en.alert ? 15 : 0; ctx.shadowColor = '#ff0'; ctx.fillRect(-20, -20, 40, 40); ctx.fillStyle = '#000'; ctx.fillRect(10, -8, 10, 16); ctx.restore(); });
            bullets.forEach(b => { ctx.fillStyle = '#fff'; ctx.shadowBlur = 10; ctx.shadowColor = '#fff'; ctx.fillRect(b.x-4, b.y-4, 8, 8); });
            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.a); ctx.shadowBlur = 25; ctx.shadowColor = '#0ff'; ctx.fillStyle = '#fff'; ctx.fillRect(-22, -22, 44, 44); ctx.restore();
        }
        updateGame();
        requestAnimationFrame(draw);
    }
    
    // обработчики ввода
    window.onkeydown = e => { keys[e.code] = true; if(e.code === 'KeyR' && state === 'PLAY') startGame(); };
    window.onkeyup = e => keys[e.code] = false;
    window.onmousemove = e => { if(player && state === 'PLAY') player.a = Math.atan2(e.clientY-player.y, e.clientX-player.x); };
    window.onmousedown = () => {
        if(state === 'PLAY' && Date.now()-(player.lastShot||0) > 125) {
            player.lastShot = Date.now(); shake = 16; sfx(160, 0.1);
            bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.a)*36, vy: Math.sin(player.a)*36 });
            enemies.forEach(en => { if(Math.hypot(en.x-player.x, en.y-player.y) < 850) en.alert = true; });
        }
    };
    
    // Меню взаимодействие
    function initMenuHandlers() {
        const btnReg = document.getElementById('btnRegister');
        const btnLogin = document.getElementById('btnLogin');
        const loginName = document.getElementById('loginName');
        const loginPass = document.getElementById('loginPass');
        const statusDiv = document.getElementById('menuStatus');
        btnReg.onclick = () => {
            let name = loginName.value.trim();
            let pass = loginPass.value.trim();
            let res = registerUser(name, pass);
            if(res === "OK") {
                statusDiv.innerHTML = `✅ Аккаунт ${name} создан! Теперь войди.`;
                loginName.value = name;
            } else statusDiv.innerHTML = `❌ ${res}`;
        };
        btnLogin.onclick = () => {
            let name = loginName.value.trim();
            let pass = loginPass.value.trim();
            let res = loginUser(name, pass);
            if(res === "OK") {
                statusDiv.innerHTML = `🎮 Добро пожаловать, ${name}! Игра начинается...`;
                overlayMenu.style.display = 'none';
                uiGame.style.display = 'block';
                statsPanel.style.display = 'block';
                state = 'PLAY';
                score = 0;
                roundKills = 0;
                initAudio();
                startGame();
                updateStatsPanel();
                updateLeaderboardUI();
                if(mainGain) mainGain.gain.setTargetAtTime(0.18, audioCtx?.currentTime || 0, 0.05);
            } else {
                statusDiv.innerHTML = `❌ ${res}`;
            }
        };
    }
    
    window.addEventListener('resize', () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; build(); });
    loadAccounts();
    updateLeaderboardUI();
    initMenuHandlers();
    draw();
</script>
</body>
